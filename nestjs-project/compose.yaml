name: mba-esai-296
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.dev
  volumes:
    - .:/home/node/app
    - node_modules:/home/node/app/node_modules
  environment: &environment
    NODE_ENV: development
    DB_HOST: db
    DB_PORT: 5432
    DB_USERNAME: streamtube
    DB_PASSWORD: streamtube
    DB_NAME: streamtube
    DB_DATABASE: streamtube
    JWT_SECRET: local-mba-296-access-secret-change-in-production
    JWT_REFRESH_SECRET: local-mba-296-refresh-secret-change-in-production
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM: noreply@streamtube.local
    REDIS_HOST: redis
    REDIS_PORT: 6379
    S3_ENDPOINT: http://storage:9000
    S3_PUBLIC_ENDPOINT: http://localhost:59000
    S3_REGION: us-east-1
    S3_ACCESS_KEY: streamtube
    S3_SECRET_KEY: streamtube-local-secret
    S3_BUCKET: streamtube-videos
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
    storage: {condition: service_healthy}
    mailpit: {condition: service_started}
services:
  nestjs-api:
    <<: *app
    command: ["sh", "-c", "npm run build && npm run migration:run && npm run start:prod"]
    ports: ["127.0.0.1:53000:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://nestjs-api:3000"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20
  video-worker:
    <<: *app
    command: ["npm", "run", "worker"]
    depends_on:
      nestjs-api: {condition: service_healthy}
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: streamtube
      POSTGRES_PASSWORD: streamtube
      POSTGRES_DB: streamtube
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamtube"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: streamtube
      MINIO_ROOT_PASSWORD: streamtube-local-secret
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["storage_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://storage:9000/minio/health/live"]
      interval: 2s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ["127.0.0.1:58025:8025"]
volumes:
  node_modules:
  postgres_data:
  redis_data:
  storage_data:
